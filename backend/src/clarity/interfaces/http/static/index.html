<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hutch</title>
<link rel="stylesheet" href="/static/styles.css">
<link rel="stylesheet" href="/static/clarity-chat.css">
</head>
<body class="customer no-nav no-compose">

<header class="agent-bar">
  <div class="inner">
    <div class="agent-identity">
      <span class="agent-avatar" aria-hidden="true">H</span>
      <div>
        <div class="agent-name">Hutch</div>
        <div class="agent-sub" id="brandSub"></div>
      </div>
    </div>
    <div id="langSlot"></div>
  </div>
</header>

<main class="agent-shell">
  <div id="error"></div>
  <div id="screen"></div>
</main>

<form class="composer-dock hidden" id="composerForm" autocomplete="off">
  <div class="composer">
    <button class="mic-btn" id="mic" type="button" aria-label="Speak">Mic</button>
    <textarea id="composerInput" rows="1" placeholder="" enterkeyhint="send"></textarea>
    <button type="submit" aria-label="Send">↑</button>
  </div>
</form>

<nav class="bottom-nav tabs-5 hidden" id="tabbar" aria-label="Hutch">
  <button type="button" data-go="home">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 10.5 12 4l8 6.5V20a1 1 0 0 1-1 1h-5v-6H10v6H5a1 1 0 0 1-1-1v-9.5z"/></svg>
    <span class="tab-label"></span>
  </button>
  <button type="button" data-go="usage">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 19V5M4 19h16"/><path d="M8 16v-4M12 16V8M16 16v-6"/></svg>
    <span class="tab-label"></span>
  </button>
  <button type="button" data-go="clarity" class="tab-clarity">
    <span class="clarity-mark" aria-hidden="true">
      <svg viewBox="0 0 24 24"><path d="M12 3a7 7 0 0 0-7 7c0 2.5 1.2 4.2 2.4 5.4.6.6 1.1 1.3 1.3 2.1h6.6c.2-.8.7-1.5 1.3-2.1C17.8 14.2 19 12.5 19 10a7 7 0 0 0-7-7z"/><path d="M9 21h6"/></svg>
    </span>
    <span class="tab-label"></span>
  </button>
  <button type="button" data-go="activity">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h10"/></svg>
    <span class="tab-label"></span>
  </button>
  <button type="button" data-go="more">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 7h14M5 12h14M5 17h14"/></svg>
    <span class="tab-label"></span>
  </button>
</nav>

<script src="/static/app.js"></script>
<script src="/static/clarity-chat.js"></script>
<script src="/static/customer.js"></script>
</body>
</html>
