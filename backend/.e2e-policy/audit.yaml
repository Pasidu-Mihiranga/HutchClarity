# Audit assurance parameters (docs/audit-assurance-plan.md, ADR-0035).
# ASSUMPTION - REQUIRES HUTCH VALIDATION: the values trade one signature per
# checkpoint against how many records an undetected truncation could remove.

keys:
  - key: audit.checkpoint.every_records
    kind: number
    owner_role: compliance
    tags: [operational]
    description: Audit records between signed checkpoints.
    values:
      - value: "50"
        version: 1

  - key: audit.checkpoint.max_age
    kind: duration
    owner_role: compliance
    tags: [operational]
    description: Longest time new audit records may go without a signed checkpoint.
    values:
      - value: PT15M
        version: 1

  - key: audit.grant.max_duration
    kind: duration
    owner_role: compliance
    tags: [operational]
    description: Longest an audit duty may be granted for. Standing access is the exception.
    values:
      - value: P90D
        version: 1

  - key: audit.grant.review_interval
    kind: duration
    owner_role: compliance
    tags: [operational]
    description: An active grant nobody recertifies within this interval lapses.
    values:
      - value: P30D
        version: 1

  - key: audit.grant.sweep_interval
    kind: duration
    owner_role: compliance
    tags: [operational]
    description: How often a server process records grants that have expired or lapsed.
    values:
      - value: PT1M
        version: 1

  - key: audit.grant.break_glass_duration
    kind: duration
    owner_role: compliance
    tags: [operational]
    description: How long a break-glass audit duty lasts before it expires on its own.
    values:
      - value: PT4H
        version: 1

  # -- assurance: detection and alerts (Phase 4, ADR-0037) --------------------
  # ASSUMPTION - REQUIRES HUTCH VALIDATION. Each threshold decides how loud a
  # rule is; a false-positive rate feeds a change here through governance,
  # never a live edit.

  - key: assurance.detection.interval
    kind: duration
    owner_role: compliance
    tags: [operational]
    description: How often risk detection runs over the audit trail.
    values:
      - value: PT5M
        version: 1

  - key: assurance.liveness.max_silence
    kind: duration
    owner_role: compliance
    tags: [operational]
    description: Longest detection may be silent before that silence is itself critical.
    values:
      - value: PT30M
        version: 1

  - key: assurance.checkpoint.max_gap
    kind: duration
    owner_role: compliance
    tags: [operational]
    description: Longest the trail may go unsigned before a critical alert.
    values:
      - value: PT1H
        version: 1

  - key: assurance.alert.ack_sla
    kind: duration
    owner_role: compliance
    tags: [operational]
    description: An open alert nobody acknowledges within this is escalated.
    values:
      - value: PT4H
        version: 1

  - key: assurance.structuring.window
    kind: duration
    owner_role: risk
    tags: [operational]
    description: Window for counting approvals just under the four-eyes cap.
    values:
      - value: PT1H
        version: 1

  - key: assurance.structuring.min_count
    kind: number
    owner_role: risk
    tags: [operational]
    description: Approvals just under the cap by one person before it is a finding.
    values:
      - value: "5"
        version: 1

  - key: assurance.structuring.near_cap_fraction
    kind: number
    owner_role: risk
    tags: [operational]
    description: Fraction of the four-eyes cap above which an amount counts as "just under".
    values:
      - value: "0.9"
        version: 1

  - key: assurance.receipt.grace
    kind: duration
    owner_role: risk
    tags: [operational]
    description: How long an execution may go without a receipt before it is a finding.
    values:
      - value: PT15M
        version: 1

  - key: assurance.switch_then_pay.window
    kind: duration
    owner_role: risk
    tags: [operational]
    description: Window in which a switch off, money moving and the switch on again is one pattern.
    values:
      - value: PT6H
        version: 1

  - key: assurance.otp_failures.window
    kind: duration
    owner_role: risk
    tags: [operational]
    description: Window for counting failed sign-in codes.
    values:
      - value: PT15M
        version: 1

  - key: assurance.otp_failures.min_count
    kind: number
    owner_role: risk
    tags: [operational]
    description: Failed codes in the window before it is a finding.
    values:
      - value: "10"
        version: 1

  - key: assurance.denials.window
    kind: duration
    owner_role: risk
    tags: [operational]
    description: Window for counting refusals for one account.
    values:
      - value: PT15M
        version: 1

  - key: assurance.denials.min_count
    kind: number
    owner_role: risk
    tags: [operational]
    description: Refusals for one account in the window before it is a finding.
    values:
      - value: "10"
        version: 1

  - key: assurance.audit_reads.window
    kind: duration
    owner_role: compliance
    tags: [operational]
    description: Window for counting reads of the audit trail by one account.
    values:
      - value: PT1H
        version: 1

  - key: assurance.audit_reads.min_count
    kind: number
    owner_role: compliance
    tags: [operational]
    description: Audit reads by one account in the window before it is a finding.
    values:
      - value: "50"
        version: 1

  - key: assurance.outbox.max_lag
    kind: duration
    owner_role: compliance
    tags: [operational]
    description: Longest an event may wait to be published before the trail counts as behind.
    values:
      - value: PT5M
        version: 1

  # -- assurance: the scenarios that needed a signal the trail now carries -----

  - key: assurance.snooping.window
    kind: duration
    owner_role: compliance
    tags: [operational]
    description: Window for counting customer records one staff account opened.
    values:
      - value: PT1H
        version: 1

  - key: assurance.snooping.min_cases
    kind: number
    owner_role: compliance
    tags: [operational]
    description: Records opened with no work done on any of them before it is a finding.
    values:
      - value: "10"
        version: 1

  - key: assurance.collusion.window
    kind: duration
    owner_role: compliance
    tags: [operational]
    description: Window for counting cases that paid the same subscriber.
    values:
      - value: P7D
        version: 1

  - key: assurance.collusion.min_cases
    kind: number
    owner_role: compliance
    tags: [operational]
    description: Cases paying one subscriber in the window before it is a finding.
    values:
      - value: "3"
        version: 1

  - key: assurance.budget.window
    kind: duration
    owner_role: compliance
    tags: [operational]
    description: Window over which executed money is totalled.
    values:
      - value: P1D
        version: 1

  - key: assurance.budget.window_alert_lkr
    kind: money
    owner_role: compliance
    tags: [operational, money]
    description: >
      Total executed in the window above which compliance is told. Not the refund
      cap: the decision policy caps one case and the budget caps the day, while
      this is how much in total may move before somebody is asked about it.
    values:
      - value: "150000.00"
        version: 1

  - key: assurance.off_hours.window
    kind: duration
    owner_role: compliance
    tags: [operational]
    description: Window for counting approvals made outside working hours.
    values:
      - value: P1D
        version: 1

  - key: assurance.off_hours.from_hour
    kind: number
    owner_role: operations
    tags: [operational]
    guardrail: { min: 0, max: 24 }
    description: First hour of the working day, Colombo time (UTC+5:30).
    values:
      - value: "7"
        version: 1

  - key: assurance.off_hours.to_hour
    kind: number
    owner_role: operations
    tags: [operational]
    guardrail: { min: 0, max: 24 }
    description: Hour the working day ends, Colombo time (UTC+5:30).
    values:
      - value: "21"
        version: 1

  - key: assurance.off_hours.min_count
    kind: number
    owner_role: compliance
    tags: [operational]
    description: Out-of-hours approvals by one account in the window before it is a finding.
    values:
      - value: "3"
        version: 1

  - key: assurance.grant_abuse.window
    kind: duration
    owner_role: compliance
    tags: [operational]
    description: An audit duty approved and revoked within this, having been used, is a finding.
    values:
      - value: PT30M
        version: 1

  - key: assurance.agent_pressure.window
    kind: duration
    owner_role: compliance
    tags: [operational]
    description: Window for counting refused assistant proposals.
    values:
      - value: PT1H
        version: 1

  - key: assurance.agent_pressure.min_count
    kind: number
    owner_role: compliance
    tags: [operational]
    description: Refused assistant proposals in the window before it is a finding.
    values:
      - value: "5"
        version: 1

  # -- lifecycle: retention (Phase 7, ADR-0039) --------------------------------

  - key: audit.retention.period
    kind: duration
    owner_role: compliance
    tags: [operational]
    description: >
      How long a record stays in the hot trail before it may be sealed into a
      segment. Archived records are not deleted: the chain stays continuous across
      the boundary. ASSUMPTION, pending the HUTCH retention period
      (REQUIRES HUTCH CONFIRMATION, plan section 8 decision 2).
    values:
      - value: P365D
        version: 1
