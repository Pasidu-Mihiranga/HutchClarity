[project]
name = "hutch-clarity"
version = "0.1.0"
description = "Hutch Clarity - explain every rupee, fix it by rule, prove it won't happen again."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }

dependencies = [
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "pyyaml>=6.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0",
    "cryptography>=43.0",
    "httpx>=0.27",
    "python-ulid>=2.7",
    "qrcode[pil]>=8.0",
    "pyjwt[crypto]>=2.9",
    # Tracing baseline (B08, plan 19 section 2.1). Pure Python, Apache-2.0, and
    # the console exporter needs no collector, so the demo profile still runs
    # with no infrastructure (ADR-0006).
    "opentelemetry-sdk>=1.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "hypothesis>=6.112",
    "ruff>=0.7",
    "mypy>=1.13",
    "types-PyYAML>=6.0",
    "types-qrcode>=8.0",
    "import-linter>=2.0",
]
# Receipt PNG/PDF rendering. Optional: the core, the demo and `make check`
# run without a browser, and render() reports clearly when it is missing.
render = [
    "playwright>=1.48",
]
# Kafka event bus driver for the `full` profile (ADR-0014, B03). Optional: the
# `demo` profile uses the in-process driver, so `make check` needs no broker.
# Licence: confluent-kafka is Apache-2.0 over librdkafka (BSD-2-Clause); both
# are OSI-approved and neutral (I17, plan 19 section 1).
kafka = [
    "confluent-kafka>=2.6",
]
# PostgreSQL repositories for the `full` profile (ADR-0013, B05). Optional: the
# `demo` profile uses the in-memory driver, so `make check` needs no database.
# Licence: psycopg 3 is LGPL-3.0, OSI-approved and already the plan's choice
# (19 section 2.1). The binary build ships libpq; no system packages needed.
postgres = [
    "psycopg[binary]>=3.2",
]
# OTLP trace export for the `full` profile, to an OpenTelemetry Collector.
# Licence: Apache-2.0. The demo profile uses the console exporter instead.
otlp = [
    "opentelemetry-exporter-otlp-proto-http>=1.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/clarity"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "ANN"]
ignore = ["ANN401"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN"]
# The receipt template is HTML and localized strings: wrapping them would hurt
# readability more than the long lines do.
"src/clarity/modules/receipts/render.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
packages = ["clarity"]
strict = true
warn_unused_ignores = true
plugins = []

[[tool.mypy.overrides]]
# Optional dependency (the `render` extra); typed when installed, absent otherwise.
module = ["playwright", "playwright.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Optional dependency (the `kafka` extra); ships no stubs.
module = ["confluent_kafka", "confluent_kafka.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Optional dependency (the `otlp` extra); present only in the full profile.
module = ["opentelemetry.exporter.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --strict-markers"
markers = [
    "golden: golden rule tests (positive/negative/boundary)",
    "property: property-based tests",
]


# --------------------------------------------------------------------------- #
# Architectural contracts (improvement plan 2.2)
#
# These are the boundaries that protect money. They are enforced on every run
# of `make check`, so a future refactor cannot quietly reopen a path the
# security story depends on.
# --------------------------------------------------------------------------- #

[tool.importlinter]
root_package = "clarity"

[[tool.importlinter.contracts]]
name = "Layers run bottom-up (enterprise-plan 21 section 4)"
type = "layers"
layers = [
    "clarity.entrypoints",
    "clarity.interfaces",
    "clarity.app",
    "clarity.modules",
    "clarity.ai",
    "clarity.platform",
    "clarity.integration",
    "clarity.contracts",
    "clarity.kernel",
]
# kernel and contracts are the shared vocabulary; integration holds the ports to
# HUTCH systems; platform holds cross-cutting services (config, audit, messaging,
# content, security); modules are the domain; app is the composition root;
# interfaces deliver it (HTTP, MCP); entrypoints start processes.

[[tool.importlinter.contracts]]
name = "AI and MCP cannot reach the tool layer's capabilities"
type = "forbidden"
source_modules = ["clarity.ai", "clarity.interfaces.mcp", "clarity.app.mcp_view"]
forbidden_modules = [
    "clarity.modules.actions.layer",
    "clarity.modules.actions.confirmation",
    "clarity.modules.actions.budget",
    "clarity.modules.actions.capability",
]
# They may import clarity.modules.actions.errors (via its public surface):
# catching a typed refusal is vocabulary, not capability. What they must never
# reach is the code that executes, mints confirmations or spends budget.
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "HTTP and MCP are independent interfaces"
type = "independence"
modules = ["clarity.interfaces.http", "clarity.interfaces.mcp"]
ignore_imports = [
    # The ops route that lists MCP tools reads the MCP tool registry.
    "clarity.interfaces.http.main -> clarity.interfaces.mcp.server",
]
