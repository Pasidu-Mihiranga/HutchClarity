asyncapi: 3.0.0
info:
  title: Hutch Clarity Events
  version: 0.1.0
  description: Domain events published via outbox → InMemoryBus (lite) or Kafka (full).
defaultContentType: application/json
channels:
  case.created:
    address: case.created
    messages:
      caseCreated:
        $ref: "#/components/messages/CaseCreated"
  cause.detected:
    address: cause.detected
    messages:
      causeDetected:
        $ref: "#/components/messages/CauseDetected"
  action.completed:
    address: action.completed
    messages:
      actionCompleted:
        $ref: "#/components/messages/ActionCompleted"
  receipt.issued:
    address: receipt.issued
    messages:
      receiptIssued:
        $ref: "#/components/messages/ReceiptIssued"
operations:
  onCaseCreated:
    action: receive
    channel:
      $ref: "#/channels/case.created"
  onCauseDetected:
    action: receive
    channel:
      $ref: "#/channels/cause.detected"
  onActionCompleted:
    action: receive
    channel:
      $ref: "#/channels/action.completed"
  onReceiptIssued:
    action: receive
    channel:
      $ref: "#/channels/receipt.issued"
components:
  messages:
    CaseCreated:
      name: CaseCreated
      payload:
        type: object
        required: [case_id, subscriber_ref]
        properties:
          case_id: { type: string }
          subscriber_ref: { type: string }
          channel: { type: string }
    CauseDetected:
      name: CauseDetected
      payload:
        type: object
        required: [case_id, cause_code]
        properties:
          case_id: { type: string }
          cause_code: { type: string }
          confidence: { type: number }
    ActionCompleted:
      name: ActionCompleted
      payload:
        type: object
        required: [action_id, case_id, outcome]
        properties:
          action_id: { type: string }
          case_id: { type: string }
          outcome: { type: string }
    ReceiptIssued:
      name: ReceiptIssued
      payload:
        type: object
        required: [receipt_id, case_id]
        properties:
          receipt_id: { type: string }
          case_id: { type: string }
          payload_hash: { type: string }
