# Hutch Clarity local runtime.
#   make up-lite  → Postgres only (daily inner loop)
#   make up-full  → Postgres + Kafka, Valkey, SeaweedFS, Keycloak, OPA, OTel/LGTM, Langfuse stub
#
# Postgres is on both profiles. Business code never reads CLARITY_PROFILE;
# only the composition root binds drivers.

services:
  postgres:
    # pgvector/pgvector:pg18 not published yet; pg16 has vector for embed work.
    image: pgvector/pgvector:pg16
    profiles: ["lite", "full"]
    environment:
      POSTGRES_USER: clarity
      POSTGRES_PASSWORD: clarity
      POSTGRES_DB: clarity
    ports:
      - "5432:5432"
    volumes:
      - clarity_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clarity -d clarity"]
      interval: 5s
      timeout: 5s
      retries: 10

  kafka:
    image: apache/kafka:3.9.0
    profiles: ["full"]
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s

  valkey:
    image: valkey/valkey:8
    profiles: ["full"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  seaweedfs-master:
    image: chrislusf/seaweedfs:3.80
    profiles: ["full"]
    command: "master -ip=seaweedfs-master -port=9333"
    ports:
      - "9333:9333"
    volumes:
      - seaweed_master:/data

  seaweedfs-volume:
    image: chrislusf/seaweedfs:3.80
    profiles: ["full"]
    command: "volume -mserver=seaweedfs-master:9333 -port=8080 -dir=/data"
    ports:
      - "8080:8080"
    volumes:
      - seaweed_volume:/data
    depends_on:
      - seaweedfs-master

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    profiles: ["full"]
    command: ["start-dev", "--http-port=8080"]
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    ports:
      - "8081:8080"
    depends_on:
      postgres:
        condition: service_healthy

  opa:
    image: openpolicyagent/opa:0.70.0
    profiles: ["full"]
    command: ["run", "--server", "--addr", "0.0.0.0:8181"]
    ports:
      - "8181:8181"

  # All-in-one OTel Collector + Grafana + Loki + Tempo + Prometheus (LGTM stack).
  otel-lgtm:
    image: grafana/otel-lgtm:0.8.1
    profiles: ["full"]
    ports:
      - "3000:3000"   # Grafana
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP

  # Optional AI observability stub — needs a real DB/schema for production use.
  langfuse:
    image: langfuse/langfuse:2
    profiles: ["full"]
    ports:
      - "3100:3000"
    environment:
      NEXTAUTH_URL: http://localhost:3100
      NEXTAUTH_SECRET: clarity-langfuse-dev-not-a-secret
      SALT: clarity-langfuse-salt
      TELEMETRY_ENABLED: "false"
      DATABASE_URL: postgresql://clarity:clarity@postgres:5432/clarity
    depends_on:
      postgres:
        condition: service_healthy
    # Stub only: may fail without Langfuse migrations; keep for compose shape.

volumes:
  clarity_pg:
  seaweed_master:
  seaweed_volume:
