limit_req_zone $binary_remote_addr zone=api_per_ip:10m rate=20r/s;

# Only the customer origin (443) may ask for the microphone, for the chat's
# opt-in voice input. The Desk (8443) and the verifier (9443) never need it.
map $server_port $clarity_permissions_policy {
    443     "camera=(), geolocation=(), microphone=(self)";
    default "camera=(), geolocation=(), microphone=()";
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

# Docker's embedded DNS. A deploy recreates containers with new addresses;
# without `resolve` Nginx keeps the addresses it saw at start and answers 502
# (first CD run, 2026-10-04). `resolve` needs a shared-memory zone.
resolver 127.0.0.11 valid=10s ipv6=off;

upstream clarity_api { zone clarity_api 64k; server clarity-api:8000 resolve; }
upstream customer_web { zone customer_web 64k; server customer-web:3000 resolve; }
upstream clarity_console { zone clarity_console 64k; server clarity-console:3000 resolve; }
upstream receipt_verify { zone receipt_verify 64k; server receipt-verify:3000 resolve; }

server {
    listen 80 default_server;
    server_name 116.203.101.73;
    location ^~ /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl default_server;
    http2 on;
    server_name 116.203.101.73;
    ssl_certificate /etc/nginx/tls/fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/privkey.pem;
    include /etc/nginx/clarity-security.conf;
    location /v1/ { limit_req zone=api_per_ip burst=40 nodelay; proxy_pass http://clarity_api; include /etc/nginx/clarity-proxy.conf; }
    location = /health { proxy_pass http://clarity_api; include /etc/nginx/clarity-proxy.conf; }
    location / { proxy_pass http://customer_web; include /etc/nginx/clarity-proxy.conf; }
}

server {
    listen 8443 ssl;
    http2 on;
    server_name 116.203.101.73;
    ssl_certificate /etc/nginx/tls/fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/privkey.pem;
    include /etc/nginx/clarity-security.conf;
    location /v1/ { limit_req zone=api_per_ip burst=40 nodelay; proxy_pass http://clarity_api; include /etc/nginx/clarity-proxy.conf; }
    location / { proxy_pass http://clarity_console; include /etc/nginx/clarity-proxy.conf; }
}

server {
    listen 9443 ssl;
    http2 on;
    server_name 116.203.101.73;
    ssl_certificate /etc/nginx/tls/fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/privkey.pem;
    include /etc/nginx/clarity-security.conf;
    location /v1/ { limit_req zone=api_per_ip burst=40 nodelay; proxy_pass http://clarity_api; include /etc/nginx/clarity-proxy.conf; }
    location / { proxy_pass http://receipt_verify; include /etc/nginx/clarity-proxy.conf; }
}
