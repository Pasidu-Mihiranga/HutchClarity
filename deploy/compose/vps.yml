name: hutch-clarity

x-backend: &backend
  image: ${REGISTRY}/hutch-clarity-backend:${IMAGE_TAG}
  env_file: /opt/hutch-clarity/.env.production
  restart: unless-stopped
  networks: [clarity-private]
  security_opt: [no-new-privileges:true]
  read_only: true
  tmpfs: [/tmp]
  mem_limit: 384m

x-frontend: &frontend
  restart: unless-stopped
  networks: [clarity-private]
  security_opt: [no-new-privileges:true]
  read_only: true
  tmpfs: [/tmp]
  mem_limit: 256m

# Health checks probe every 2s while a container starts (start_interval,
# Docker 25+), then every 10s. Each tier of the start chain used to wait up to
# 10s to be seen healthy.
services:
  postgres:
    image: pgvector/pgvector:pg18
    restart: unless-stopped
    env_file: /opt/hutch-clarity/.env.production
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_INITDB_ARGS: --locale=C --encoding=UTF8
    # PostgreSQL 18 stores versioned clusters below this parent directory.
    volumes: [postgres_data:/var/lib/postgresql]
    networks: [clarity-private]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 30
    mem_limit: 512m

  kafka:
    image: apache/kafka:4.0.0
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:19092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:19092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_NUM_PARTITIONS: "3"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      CLUSTER_ID: clarity-vps-demo-00001
      KAFKA_HEAP_OPTS: -Xms256m -Xmx512m
    volumes: [kafka_data:/var/lib/kafka/data]
    networks: [clarity-private]
    healthcheck:
      test: [CMD-SHELL, "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:19092 >/dev/null"]
      interval: 10s
      start_period: 120s
      start_interval: 2s
      timeout: 8s
      retries: 30
    mem_limit: 768m

  keycloak:
    image: quay.io/keycloak/keycloak:26.4
    command: [start-dev, --import-realm, --http-port=8080, --health-enabled=true]
    restart: unless-stopped
    env_file: /opt/hutch-clarity/.env.production
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
    volumes:
      - keycloak_data:/opt/keycloak/data
      - ../../config/keycloak/clarity-realm.json:/opt/keycloak/data/import/clarity-realm.json:ro
    networks: [clarity-private]
    healthcheck:
      test: [CMD-SHELL, "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /realms/clarity HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 && grep -q '200 OK' <&3"]
      interval: 10s
      start_period: 120s
      start_interval: 2s
      timeout: 5s
      retries: 30
    mem_limit: 512m

  opa:
    image: openpolicyagent/opa:1.1.0
    command: [run, --server, --addr=0.0.0.0:8181, /policy]
    restart: unless-stopped
    volumes: [../../config/opa:/policy:ro]
    networks: [clarity-private]
    healthcheck:
      test: [CMD, /opa, eval, "1"]
      interval: 10s
      start_period: 120s
      start_interval: 2s
      timeout: 5s
      retries: 20
    mem_limit: 128m

  hutch-sim:
    <<: *backend
    command: [uvicorn, --app-dir, services/hutch-sim/src, main:app, --host, 0.0.0.0, --port, "8103"]
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8103/health', timeout=3)"]
      interval: 10s
      start_period: 120s
      start_interval: 2s
      timeout: 5s
      retries: 20

  clarity-api:
    <<: *backend
    command: [uvicorn, clarity.entrypoints.asgi:app, --host, 0.0.0.0, --port, "8000", --proxy-headers, --forwarded-allow-ips, "*"]
    depends_on:
      postgres: {condition: service_healthy}
      kafka: {condition: service_healthy}
      keycloak: {condition: service_healthy}
      opa: {condition: service_healthy}
      hutch-sim: {condition: service_healthy}
    volumes:
      - /opt/hutch-clarity/private/signing:/run/clarity-keys
      - /opt/hutch-clarity/private/google-service-account.json:/run/clarity-private/google-service-account.json:ro
      - /opt/hutch-clarity/private/staff-directory.json:/run/clarity-private/staff-directory.json:ro
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      start_period: 120s
      start_interval: 2s
      timeout: 5s
      retries: 30

  clarity-mcp:
    <<: *backend
    command: [uvicorn, clarity.entrypoints.mcp_asgi:app, --host, 0.0.0.0, --port, "8099"]
    depends_on: {clarity-api: {condition: service_healthy}}
    volumes:
      - /opt/hutch-clarity/private/signing:/run/clarity-keys
      - /opt/hutch-clarity/private/google-service-account.json:/run/clarity-private/google-service-account.json:ro
      - /opt/hutch-clarity/private/staff-directory.json:/run/clarity-private/staff-directory.json:ro
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8099/health', timeout=3)"]
      interval: 10s
      start_period: 120s
      start_interval: 2s
      timeout: 5s
      retries: 20

  clarity-channel-gateway:
    <<: *backend
    command: [uvicorn, --app-dir, services/channel-gateway/src, main:app, --host, 0.0.0.0, --port, "8102"]
    depends_on: {clarity-api: {condition: service_healthy}}
    volumes:
      - /opt/hutch-clarity/private/signing:/run/clarity-keys
      - /opt/hutch-clarity/private/google-service-account.json:/run/clarity-private/google-service-account.json:ro
      - /opt/hutch-clarity/private/staff-directory.json:/run/clarity-private/staff-directory.json:ro
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8102/health', timeout=3)"]
      interval: 10s
      start_period: 120s
      start_interval: 2s
      timeout: 5s
      retries: 20

  customer-web:
    <<: *frontend
    image: ${REGISTRY}/hutch-clarity-customer:${IMAGE_TAG}
    depends_on: {clarity-api: {condition: service_healthy}}

  clarity-console:
    <<: *frontend
    image: ${REGISTRY}/hutch-clarity-console:${IMAGE_TAG}
    depends_on: {clarity-api: {condition: service_healthy}}

  receipt-verify:
    <<: *frontend
    image: ${REGISTRY}/hutch-clarity-verify:${IMAGE_TAG}
    depends_on: {clarity-api: {condition: service_healthy}}

  reverse-proxy:
    image: nginx:1.28-alpine
    restart: unless-stopped
    depends_on:
      customer-web: {condition: service_healthy}
      clarity-console: {condition: service_healthy}
      receipt-verify: {condition: service_healthy}
    ports: ["80:80", "443:443", "8443:8443", "9443:9443"]
    volumes:
      - ../nginx/vps.conf:/etc/nginx/conf.d/default.conf:ro
      - ../nginx/clarity-proxy.conf:/etc/nginx/clarity-proxy.conf:ro
      - ../nginx/clarity-security.conf:/etc/nginx/clarity-security.conf:ro
      - /opt/hutch-clarity/certbot/www:/var/www/certbot:ro
      - /opt/hutch-clarity/tls:/etc/nginx/tls:ro
    networks: [clarity-private]
    security_opt: [no-new-privileges:true]
    mem_limit: 128m

networks:
  clarity-private:
    internal: false

volumes:
  postgres_data:
  kafka_data:
  keycloak_data:
