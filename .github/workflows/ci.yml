# CI lanes (B10, issue #18; plan 12 section 23).
#
# Two lanes, because one is not enough. The `lite` lane proves the code is
# correct with no infrastructure, which is what ADR-0006 promises a reviewer.
# The `full` lane runs the same parity suites against the real components, which
# is the only thing that proves a driver actually honours its port: a mock that
# has drifted passes the lite lane every time.
#
# Nothing here is `continue-on-error` any more. A check that cannot fail the
# build is documentation, not a gate.

name: ci

on:
  push:
    branches: [main, dev]
  pull_request:

permissions:
  contents: read

env:
  # The Python the venv and the console scripts agree on.
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "20"

jobs:
  backend-lite:
    name: backend lite (lint, types, import contracts, tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install
        run: pip install -e ".[dev]"
      - name: Ruff
        run: |
          ruff check .
          ruff format --check .
      - name: Mypy (strict)
        run: mypy
      - name: Import contracts (layers, money boundary)
        run: lint-imports
      - name: Tests (unit, golden, property, contract, architecture)
        run: pytest

  backend-full:
    name: backend full (PostgreSQL and Kafka drivers)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_USER: clarity
          POSTGRES_PASSWORD: clarity
          POSTGRES_DB: clarity
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U clarity -d clarity"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      openbao:
        # Signs receipts in the full lane, so the Transit driver is exercised
        # against the real API rather than against a Python stand-in of it
        # (M-RCPT). Dev mode: in-memory, unsealed, fixed root token. The token
        # is a CI-only literal and grants nothing outside this container.
        image: ghcr.io/openbao/openbao:2.7.1
        env:
          BAO_DEV_ROOT_TOKEN_ID: clarity-ci-only-not-a-secret
          BAO_ADDR: http://127.0.0.1:8200
        ports: ["8200:8200"]
        options: >-
          --cap-add IPC_LOCK
          --health-cmd "bao status"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      kafka:
        image: apache/kafka:4.0.0
        env:
          KAFKA_NODE_ID: "1"
          KAFKA_PROCESS_ROLES: broker,controller
          KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
          KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
          KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
          KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
          KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
          KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
          KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
          KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
          KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
          KAFKA_NUM_PARTITIONS: "6"
          CLUSTER_ID: clarity-ci-cluster-00001
        ports: ["9092:9092"]
        options: >-
          --health-cmd "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 20
    env:
      CLARITY_TEST_DATABASE_URL: postgresql+psycopg://clarity:clarity@localhost:5432/clarity
      CLARITY_KAFKA_BOOTSTRAP: localhost:9092
      CLARITY_OPA_URL: http://localhost:8181
      CLARITY_OPENBAO_URL: http://localhost:8200
      CLARITY_OPENBAO_TOKEN: clarity-ci-only-not-a-secret
      CLARITY_KEYCLOAK_URL: http://localhost:8081
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install with the full-profile extras
        run: pip install -e ".[dev,postgres,kafka,otlp]"
      - name: Start OPA with the real policy mounted
        # Run as a step, not a service container, for two reasons. A service
        # container starts before the checkout, so it cannot mount
        # config/opa; and a service container cannot set the image's command,
        # which OPA needs ("run --server"), so the only way to express it was
        # an `--args` option that `docker create` rejects outright. That is
        # what failed this lane with exit 125.
        #
        # Mounting the directory is also what deploy/compose/full.yml does, so
        # CI and the local stack now load the policy the same way.
        run: |
          set -euo pipefail
          docker run -d --name clarity-ci-opa -p 8181:8181 \
            -v "$GITHUB_WORKSPACE/config/opa:/policy:ro" \
            openpolicyagent/opa:1.1.0 \
            run --server --addr=0.0.0.0:8181 /policy
          for attempt in $(seq 1 30); do
            curl -sf localhost:8181/health >/dev/null && break || sleep 2
          done
          # Checked, not assumed: an OPA answering with no policy denies
          # everything, which the parity suite would read as a disagreement
          # with Python rather than as "the policy never loaded".
          echo "an agent may read a case:"
          curl -sf -X POST localhost:8181/v1/data/clarity/authz/allow \
            -H 'Content-Type: application/json' \
            -d '{"input":{"roles":["agent"],"permission":"case:read","assurance":"mfa"}}' \
            | tee /dev/stderr | grep -q '"result":true'
        shell: bash
      - name: Start Keycloak with the realm imported
        # Run as a step, not a service container, for two reasons. A service
        # container starts before the checkout so it cannot mount the realm
        # file; and Keycloak's master realm refuses an admin token over plain
        # HTTP ("HTTPS required"), so importing through the admin API does not
        # work either. Importing at startup avoids both, and is exactly what
        # deploy/compose/full.yml does locally.
        run: |
          set -euo pipefail
          docker run -d --name clarity-keycloak -p 8081:8080 \
            -e KC_BOOTSTRAP_ADMIN_USERNAME=clarity-admin \
            -e KC_BOOTSTRAP_ADMIN_PASSWORD=clarity-ci-only-not-a-secret \
            -v "$GITHUB_WORKSPACE/config/keycloak/clarity-realm.json:/opt/keycloak/data/import/clarity-realm.json:ro" \
            quay.io/keycloak/keycloak:26.4 \
            start-dev --import-realm --http-port=8080
          for attempt in $(seq 1 40); do
            curl -sf localhost:8081/realms/clarity >/dev/null && break || sleep 3
          done
          # Checked, not assumed: a Keycloak with no realm answers 404 for
          # everything, which the integration lane would read as a broken
          # driver rather than a realm that never imported.
          curl -sf localhost:8081/realms/clarity >/dev/null
          echo "the clarity realm answers"
        shell: bash
      - name: Parity suites against the real drivers
        # The suites skip when a component is unreachable, so a silent skip
        # here would look like a pass. -ra lists every skip in the summary.
        run: pytest tests/contract -v -ra
      - name: Integration (schema isolation, row-level security, two replicas)
        run: pytest tests/integration -v -ra
      - name: Fail if the full-profile tests only skipped
        # The lane exists to exercise the real drivers. If they all skipped, the
        # services did not come up and the lane proved nothing.
        run: |
          set -o pipefail
          pytest tests/integration -q 2>&1 | tee result.txt
          if grep -qE "^(no tests ran|[0-9]+ skipped)$" result.txt; then
            echo "::error::the full lane skipped its tests; PostgreSQL or Kafka did not start"
            exit 1
          fi

  contracts:
    name: contracts (OpenAPI schema and generated SDK are current)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: |
          pip install -e "backend[dev]"
          cd frontend && npm ci
      - name: The committed OpenAPI schema matches what the app serves
        run: cd backend && python scripts/export_openapi.py --check
      - name: The committed SDK types match the schema
        run: cd frontend && npm run sdk:check

  frontend:
    name: frontend (typecheck and build)
    runs-on: ubuntu-latest
    # Blocking (B10). It used to report without failing, which meant a broken
    # build could land; the build is green, so the exemption is gone.
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
      - name: Typecheck the SDK
        run: npm run typecheck
      - name: Build every app
        run: npm run build

  secrets:
    name: secret scanning (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Gitleaks scans history, not just the tip: a key that was committed
          # and then removed is still a leaked key.
          fetch-depth: 0
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"

  dast:
    name: DAST (OWASP ZAP baseline)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install
        run: pip install -e "backend[dev]"

      - name: Start the API
        # Scanned where it runs, not on "staging": there is no staging
        # environment, and saying there is would be worse than saying this.
        # The lite profile needs no services (ADR-0006) and serves the same
        # routes, headers and static UI as any other profile, which is what a
        # baseline scan looks at.
        run: |
          set -euo pipefail
          cd backend
          CLARITY_PROFILE=lite OTEL_EXPORTER=none \
            python -m uvicorn clarity.entrypoints.asgi:app \
            --host 127.0.0.1 --port 8100 &
          for attempt in $(seq 1 30); do
            curl -sf localhost:8100/health >/dev/null && break || sleep 2
          done
          # Checked, not assumed: ZAP against a dead port reports a clean scan.
          curl -sf localhost:8100/health >/dev/null
          echo "the api answers"

      - name: ZAP baseline
        uses: zaproxy/action-baseline@v0.14.0
        with:
          target: http://127.0.0.1:8100
          rules_file_name: .zap/rules.tsv
          # Fail on a new alert. The three known warnings are IGNOREd in the
          # rules file, each with its reason, so anything new is a regression.
          allow_issue_writing: false
          cmd_options: "-a"

  deploy:
    name: deployment artefacts (image, Helm on kind, OpenTofu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the image
        # One image for every Python deployable (plan 21 section 11.1, S1).
        # The context is the repository root because rules/ and config/ are
        # read at runtime and are versioned with the code (I10, I11).
        run: docker build -f deploy/docker/Dockerfile -t clarity:ci .

      - name: Lint and render the chart
        run: |
          set -euo pipefail
          helm lint deploy/helm/clarity
          # Rendering before install turns a template error into a readable
          # failure here rather than an opaque one from the API server.
          helm template clarity deploy/helm/clarity --set image.tag=ci > /tmp/rendered.yaml
          test -s /tmp/rendered.yaml

      - name: Create a kind cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: clarity-ci
          wait: 120s

      - name: Load the image into the cluster
        # Loaded rather than pulled: there is no registry in CI, which is also
        # why the chart's pullPolicy must not be Always.
        run: kind load docker-image clarity:ci --name clarity-ci

      - name: Install the chart
        run: |
          helm install clarity deploy/helm/clarity \
            --set image.tag=ci \
            --wait --timeout 5m

      - name: Smoke test every deployable
        # ADR-0016 requires /health on each one, so each one is asked.
        # `rollout status` already waited; this proves the contract, not just
        # that a pod started.
        run: |
          set -euo pipefail
          for deployable in api mcp channel-gateway; do
            echo "::group::$deployable"
            kubectl rollout status "deployment/clarity-$deployable" --timeout=120s
            port=$(kubectl get svc "clarity-$deployable" -o jsonpath='{.spec.ports[0].port}')
            kubectl run "smoke-$deployable" --rm -i --restart=Never \
              --image=curlimages/curl:8.11.1 -- \
              curl -sf --max-time 10 "http://clarity-$deployable:$port/health"
            echo "::endgroup::"
          done

      - name: Show what failed, if anything
        if: failure()
        run: |
          kubectl get pods -o wide || true
          kubectl describe pods || true
          kubectl logs -l app.kubernetes.io/name=clarity --all-containers --tail=100 || true

      - name: OpenTofu reference validates
        # validate and fmt only. There is no target cluster and no credentials,
        # so a plan would prove nothing (deploy/opentofu/README.md).
        uses: opentofu/setup-opentofu@v1
      - run: |
          set -euo pipefail
          tofu -chdir=deploy/opentofu init -backend=false
          tofu -chdir=deploy/opentofu validate
          tofu -chdir=deploy/opentofu fmt -check

  sbom:
    name: SBOM and licence check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install the runtime dependencies to inventory
        run: pip install -e "backend[postgres,kafka,otlp]"
      - name: Syft SBOM (CycloneDX)
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: cyclonedx-json
          output-file: sbom.cyclonedx.json
          artifact-name: sbom.cyclonedx.json
      - name: "Licence check (I17): neutral, OSI licences in the runtime path"
        run: |
          pip install pip-licenses
          pip-licenses --format=json --with-urls > licences.json
          python backend/scripts/check_licences.py licences.json
      - uses: actions/upload-artifact@v4
        with:
          name: licences
          path: licences.json
