name: deploy demo VPS

on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      operation:
        description: Deploy the selected main SHA or roll back
        required: true
        type: choice
        options: [deploy, rollback]
        default: deploy
      sha:
        description: Full CI-approved main commit SHA; blank uses main
        required: false
        type: string

permissions:
  actions: read
  contents: read
  packages: write

concurrency:
  group: demo-vps-deployment
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    environment: demo-vps
    steps:
      - name: Resolve the CI-approved release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_SHA: ${{ inputs.sha }}
        run: |
          set -euo pipefail
          operation=${{ inputs.operation || 'deploy' }}
          if [[ "$operation" == rollback ]]; then
            echo "operation=rollback" >> "$GITHUB_OUTPUT"
            echo "sha=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ "${{ github.event_name }}" == workflow_run ]]; then
            sha=${{ github.event.workflow_run.head_sha }}
          elif [[ -n "$REQUESTED_SHA" ]]; then
            sha=$REQUESTED_SHA
          else
            sha=$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq .sha)
          fi
          [[ $sha =~ ^[0-9a-f]{40}$ ]]
          head=$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq .sha)
          # Two merges in quick succession start two CI runs. The older one's
          # deploy must not land after the newer one, and failing it would
          # report a broken pipeline that is not broken: skip it.
          if [[ "${{ github.event_name }}" == workflow_run && $sha != "$head" ]]; then
            echo "::notice::$sha is no longer the head of main ($head); its own run deploys the newer commit"
            echo "operation=skip" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # A manual deploy may name an older commit, but only one on main.
          on_main=$(gh api "repos/${GITHUB_REPOSITORY}/compare/$sha...main" --jq .status)
          [[ $on_main == identical || $on_main == ahead ]]
          passed=$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=$sha&status=success&per_page=1" \
            --jq '.total_count')
          [[ $passed -ge 1 ]]
          echo "operation=deploy" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        if: steps.release.outputs.operation == 'deploy'
        with:
          ref: ${{ steps.release.outputs.sha }}

      - uses: docker/setup-buildx-action@v3
        if: steps.release.outputs.operation == 'deploy'

      - uses: docker/login-action@v3
        if: steps.release.outputs.operation == 'deploy'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push immutable images
        if: steps.release.outputs.operation == 'deploy'
        env:
          SHA: ${{ steps.release.outputs.sha }}
          REGISTRY: ghcr.io/pasidu-mihiranga
        run: |
          set -euo pipefail
          docker buildx build --push --cache-from type=gha --cache-to type=gha,mode=max \
            -f deploy/docker/Dockerfile -t "$REGISTRY/hutch-clarity-backend:$SHA" .
          for spec in customer:customer-web console:console verify:verify; do
            image=${spec%%:*}
            app=${spec#*:}
            docker buildx build --push --cache-from type=gha --cache-to type=gha,mode=max \
              --build-arg "APP=$app" --build-arg NEXT_PUBLIC_API_BASE= \
              -f deploy/docker/Dockerfile.frontend \
              -t "$REGISTRY/hutch-clarity-$image:$SHA" .
          done

      - name: Configure pinned SSH
        if: steps.release.outputs.operation != 'skip'
        env:
          SSH_PRIVATE_KEY: ${{ secrets.HETZNER_SSH_PRIVATE_KEY }}
          KNOWN_HOSTS: ${{ secrets.HETZNER_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -d -m 0700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 0600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts

      - name: Roll back without rebuilding
        if: steps.release.outputs.operation == 'rollback'
        env:
          HOST: ${{ secrets.HETZNER_HOST }}
          USER: ${{ secrets.HETZNER_USER }}
        run: ssh "$USER@$HOST" /opt/hutch-clarity/deploy/scripts/rollback.sh

      - name: Upload deployment metadata and deploy
        if: steps.release.outputs.operation == 'deploy'
        env:
          GHCR_TOKEN: ${{ github.token }}
          HOST: ${{ secrets.HETZNER_HOST }}
          USER: ${{ secrets.HETZNER_USER }}
          SHA: ${{ steps.release.outputs.sha }}
        run: |
          set -euo pipefail
          tar -czf /tmp/clarity-deploy.tgz deploy/compose/vps.yml deploy/nginx deploy/scripts deploy/systemd config/keycloak config/opa
          scp /tmp/clarity-deploy.tgz "$USER@$HOST:/opt/hutch-clarity/releases/$SHA.tgz"
          ssh "$USER@$HOST" "tar -xzf /opt/hutch-clarity/releases/$SHA.tgz -C /opt/hutch-clarity"
          printf '%s' "$GHCR_TOKEN" | ssh "$USER@$HOST" docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          ssh "$USER@$HOST" "/opt/hutch-clarity/deploy/scripts/deploy.sh $SHA"

      - name: Remove the registry login from the server
        if: always() && steps.release.outputs.operation == 'deploy'
        env:
          HOST: ${{ secrets.HETZNER_HOST }}
          USER: ${{ secrets.HETZNER_USER }}
        # The job token expires with the job; leaving it on disk helps nobody.
        run: ssh "$USER@$HOST" docker logout ghcr.io || true
