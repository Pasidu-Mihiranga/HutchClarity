# Model roles → providers. Code requests roles; never hard-code model IDs.
# Text roles call Vertex AI (gemini-2.5-flash). Speech stays on Groq, then a
# local refusal: Vertex text models do not transcribe. Unbound providers are
# skipped, so a process without Vertex still ends on the local step.

roles:
  fast-text:
    primary:
      provider: vertex
      model: gemini-2.5-flash
    fallback:
      - provider: gemini
        model: gemini-2.0-flash-lite
      - provider: template
        model: local-template

  extract:
    primary:
      provider: vertex
      model: gemini-2.5-flash
    fallback:
      - provider: gemini
        model: gemini-2.0-flash-lite
      # Keyword rules. Real local capability, and the path C04 wants used first
      # anyway: the model is only asked when the rules are unsure.
      - provider: local-rules
        model: keyword-intake

  reason:
    primary:
      provider: vertex
      model: gemini-2.5-flash
    fallback:
      - provider: groq
        model: openai/gpt-oss-120b
      - provider: gemini
        model: gemini-2.0-flash-lite
      # The same approved wording the fast-text role ends with. An explanation
      # from a template is shorter than a model's, and it is always correct.
      - provider: template
        model: local-template

  judge:
    primary:
      provider: vertex
      model: gemini-2.5-flash
    fallback:
      - provider: groq
        model: openai/gpt-oss-120b
      # Returns "unscored", deterministically. There is no local way to judge
      # an answer's quality, so this reports that the evaluation could not be
      # made rather than inventing a score a release gate would then trust.
      - provider: local-unscored
        model: no-judgement

  guard:
    primary:
      provider: vertex
      model: gemini-2.5-flash
    fallback:
      - provider: template
        model: local-guard-rules

  embed:
    primary:
      provider: local-bge
      model: BAAI/bge-m3
    fallback:
      - provider: local-bge
        model: BAAI/bge-small-en-v1.5

  stt:
    primary:
      provider: groq
      model: whisper-large-v3
    fallback:
      - provider: groq
        model: whisper-large-v3-turbo
      # Returns "transcription unavailable", never a guessed transcript. A
      # fabricated transcript would be invented customer input, and the whole
      # system treats customer text as a hint to be checked against records
      # (I2). The conversation flow reads this as "no text" and hands off.
      - provider: local-unavailable
        model: no-transcription

  tts:
    primary:
      provider: groq
      model: playai-tts
    fallback:
      - provider: template
        model: local-tts-stub

defaults:
  prefer_templates: true
  mask_pii_before_send: true
  record_replay_cassette_dir: cassettes
