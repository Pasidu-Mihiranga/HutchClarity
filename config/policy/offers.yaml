# Offer verification parameters (OFFER01).
#
# A customer pastes an SMS claiming to be a HUTCH offer and asks whether it is
# real. These decide how much of a recorded offer has to appear in the pasted
# message for it to count as the same offer, and which words and hosts the
# answer reports as warning signs.
#
# They are here and not in code because I10 keeps every threshold out of the
# source, and because these in particular should be hard to change quietly: a
# lowered match bar makes a scam read as genuine, and a HUTCH host added here
# is a host the system will vouch for.
#
# Every value is **PROPOSED TARGET - REQUIRES HUTCH VALIDATION**. The match
# bars were set against the simulated offers in `app/offer_seed.py` and not
# against real HUTCH campaign traffic. The host list is **ASSUMPTION**: it has
# not been confirmed which domains HUTCH actually sends.

version: 1

keys:
  - key: offers.match.confirm_containment
    kind: number
    owner_role: security_admin
    tags: [customer_visible, outcome]
    description: >
      Share of a recorded offer's own terms that must appear in the pasted
      message before it is reported as matching that offer, 0-1. Containment
      rather than similarity: a genuine SMS forwarded with a line of chat added
      in front of it should still match, and a symmetric measure would punish
      the extra words.
    values:
      - value: "0.6"
        version: 1

  - key: offers.match.review_containment
    kind: number
    owner_role: security_admin
    tags: [customer_visible, outcome]
    description: >
      Share at or above which a partial match goes to a person rather than
      being reported as not on record. The band between this and
      confirm_containment is the case both other verdicts would get wrong: a
      real offer forwarded with half of it cut off, and a scam built by editing
      a real one. It must be at or below confirm_containment, and the service
      refuses to run if it is not.
    guardrail:
      min: "0.2"
      max: "1.0"
    values:
      - value: "0.35"
        version: 1

  - key: offers.hutch_hosts
    kind: string
    owner_role: security_admin
    tags: [customer_visible, outcome]
    description: >
      Comma-separated hosts that are HUTCH's own. A link to anything else is
      reported as a warning sign. Matched on a label boundary, so a subdomain
      counts and a lookalike like "nothutch.lk" does not. ASSUMPTION - the real
      list REQUIRES HUTCH CONFIRMATION.
    values:
      - value: "hutch.lk,hutch.com"
        version: 1

  - key: offers.signal.code_words
    kind: string
    owner_role: security_admin
    tags: [customer_visible, operational]
    description: >
      Comma-separated phrases that mean the message is asking for a one-time
      code, PIN or password. HUTCH never asks for one, so this is the single
      most useful sign in the answer. Sinhala and Tamil included, because a
      smishing SMS is written in the language of its target.
    values:
      - value: >-
          otp,o.t.p,one time code,one-time code,one time password,pin,
          password,verification code,secret code,cvv,
          මුරපද,රහස් කේත,කේතය එවන්න,
          கடவுச்சொல்,இரகசிய குறியீடு,குறியீட்டை அனுப்பு
        version: 1

  - key: offers.signal.call_words
    kind: string
    owner_role: security_admin
    tags: [customer_visible, operational]
    description: >
      Comma-separated phrases that ask the reader to make contact on a number
      in the message. Reported only when a callback number is also present, so
      a genuine SMS mentioning the HUTCH hotline in passing does not trip it.
    values:
      - value: >-
          call now,call this number,call back,whatsapp,dial,ring this,
          contact us on,අමතන්න,කතා කරන්න,அழைக்கவும்,தொடர்பு கொள்ளுங்கள்
        version: 1

  - key: offers.signal.payment_words
    kind: string
    owner_role: security_admin
    tags: [customer_visible, operational]
    description: >
      Comma-separated phrases that ask for money or card details to release
      something that is supposed to be free. A HUTCH offer is applied to the
      account; it is never unlocked by a payment to a third party.
    values:
      - value: >-
          processing fee,delivery fee,small fee,pay lkr,reload first,
          send money,card number,card details,bank details,
          ගෙවීම් කරන්න,මුදල් යවන්න,කාඩ්පත් අංකය,
          கட்டணம் செலுத்த,பணம் அனுப்ப,அட்டை எண்
        version: 1

  - key: offers.signal.urgency_words
    kind: string
    owner_role: security_admin
    tags: [customer_visible, operational]
    description: >
      Comma-separated phrases that press for action inside a deadline, which is
      how a mark is rushed past checking. Weakest of the signals and reported
      as such: a genuine offer can legitimately expire.
    values:
      - value: >-
          expires today,expire today,within 24 hours,within 2 hours,
          last chance,act now,immediately,hurry,only today,claim now,
          අදම,වහාම,අවසන් අවස්ථාව,
          இன்றே,உடனடியாக,கடைசி வாய்ப்பு
        version: 1
